    // ---- Scene 5: markdown fixture, uncompressed JSON, metadata-rich ----
    const fm1 = "excalidraw-plugin: parsed\ntags:\n  - excalidraw\n  - fixture\nexcalidraw-export-dark: false\nexcalidraw-export-transparent: false\nexcalidraw-export-padding: 14\nexcalidraw-export-pngscale: 1\nexcalidraw-autoexport: svg\nexcalidraw-link-prefix: \"->\"\nexcalidraw-link-brackets: true\nexcalidraw-default-mode: view\nexcalidraw-font: Virgil\nexcalidraw-font-color: \"#1e1e1e\"\n";

    out["metadata-uncompressed.excalidraw.md"] = mdEnvelopeJson(

      s5, {}, sceneJson(s5, {}), null);

    // ---- Scene 6: compressed markdown fixture with external attachment metadata ----
    const s6 = L.convertToExcalidrawElements([
      { id: "md-image", type: "image", x: 40, y: 60, width: 440, height: 282, fileId: PNG_FILEID, status: "saved",

    out["compressed-attachment.excalidraw.md"] = mdEnvelope(
      { frontmatter: fm2, backOfNote: "Compressed drawing with an external attachment. The image bytes live in `attachments/exported-preview.png`; the scene JSON keeps only the SHA-1 `fileId`." },
      s6, {}, sceneJson(s6, {}), embedded);

    document.getElementById("out").textContent = JSON.stringify({
      ok: true,
      sha1: PNG_FILEID,
      pngBytes: PNG_B64.length,
      ids: { s1: s1.map(e => e.id + ":" + e.type), s2: s2.map(e => e.id + ":" + e.type), s3: s3.map(e => e.id + ":" + e.type), s4: s4.map(e => e.id + ":" + e.type), s5: s5.map(e => e.id + ":" + e.type), s6: s6.map(e => e.id + ":" + e.type) },

  } catch (e) {
