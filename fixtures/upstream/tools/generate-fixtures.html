      ids: { s1: s1.map(e => e.id + ":" + e.type), s2: s2.map(e => e.id + ":" + e.type), s3: s3.map(e => e.id + ":" + e.type), s4: s4.map(e => e.id + ":" + e.type), s5: s5.map(e => e.id + ":" + e.type), s6: s6.map(e => e.id + ":" + e.type) },
      files: out
    });
  } catch (e) {
    document.getElementById("out").textContent = JSON.stringify({ ok: false, error: e.stack });
  }
})();
</script></body></html>
